<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>리뷰 크롤링 에이전트</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <h1>리뷰 크롤링 에이전트</h1>
    <p class="sub">네이버 플레이스 · 카카오맵 · 배달의민족 · 쿠팡이츠 리뷰를 수집하고
      긍정/부정으로 분류합니다.</p>

    <form id="crawl-form">
      <input type="url" id="url" name="url" required
             placeholder="리뷰 페이지 링크를 붙여넣으세요" />
      <button type="submit">크롤링 시작</button>
    </form>

    <div id="status" class="status hidden"></div>
    <p id="error" class="error"></p>

    <section class="hint">
      <h3>지원 링크 예시</h3>
      <ul>
        <li>네이버: <code>m.place.naver.com/restaurant/&lt;id&gt;/review/visitor</code></li>
        <li>카카오맵: <code>place.map.kakao.com/&lt;id&gt;</code></li>
        <li>배민/쿠팡이츠: 로그인 세션 저장 후 매장 리뷰 URL</li>
      </ul>
    </section>
  </main>

  <script>
    const form = document.getElementById("crawl-form");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      statusBox.classList.remove("hidden");
      statusBox.textContent = "작업을 시작합니다…";

      const body = new FormData();
      body.append("url", document.getElementById("url").value);

      const res = await fetch("/crawl", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) {
        statusBox.classList.add("hidden");
        errorBox.textContent = data.error || "오류가 발생했습니다.";
        return;
      }
      poll(data.job_id);
    });

    async function poll(jobId) {
      const res = await fetch(`/jobs/${jobId}/status`);
      const data = await res.json();
      if (data.status === "done") {
        window.location.href = `/jobs/${jobId}`;
        return;
      }
      if (data.status === "error") {
        statusBox.classList.add("hidden");
        errorBox.textContent = data.message;
        return;
      }
      statusBox.textContent = data.status === "running"
        ? "리뷰를 수집하고 분석하는 중입니다…"
        : "대기 중…";
      setTimeout(() => poll(jobId), 1500);
    }
  </script>
</body>
</html>
