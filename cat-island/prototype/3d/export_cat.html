<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
// Builds one breed with all clips and exports a binary glTF (driven by export_cats.py).
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { BREEDS } from './catgen.js';
import { buildCatModel } from './catmodel.js';
import { GROOM_ROUTINE, makeRig, makeClips, bakeClip, applyPose, stand } from './catmotion.js';
const q = new URLSearchParams(location.search);
const b = BREEDS.find(x => x.id === (q.get('id') || 'korean_shorthair'));
const coat = q.get('coat') ? JSON.parse(q.get('coat')) : b.coat;
const cat = buildCatModel(b.shape, coat, { res: +(q.get('res') || .016), name: 'Cat_' + b.id });
// contacts are solved on a coarser build of the same cat (same skeleton): much faster, same poses
const rig = makeRig(cat), defs = makeClips(rig, { solveRig: makeRig(buildCatModel(b.shape, b.coat, { res: .03 })) });
const clips = defs.map(d => bakeClip(rig, d));
applyPose(rig, stand(rig));                       // leave the rig in the rest-like standing pose
const scene = new THREE.Scene(); scene.add(cat);
const glb = await new GLTFExporter().parseAsync(scene, { binary: true, animations: clips });
const bytes = new Uint8Array(glb);
let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
window.__glb = btoa(bin);
window.__info = { id: b.id, ko: b.ko, tris: cat.userData.tris, bones: cat.userData.skeleton.bones.length,
  clips: defs.map(d => ({ name: d.name, dur: +d.dur.toFixed(3), loop: d.loop, rootMotion: !!d.rootMotion, speed: d.speed && +d.speed.toFixed(3), stride: d.stride && +d.stride.toFixed(3), jump: d.jump })), groomRoutine: GROOM_ROUTINE.filter(r => defs.some(d => d.name === r.clip)), skippedClips: defs.skipped || [] };
window.__done = true;
</script></body></html>
