<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Item detail test (docs/ART_DIRECTION.md 5장, step A): three items rebuilt with toy detail - crisp but rounded
// edges, painted textures (fabric check, weave, wood grain, glaze, sisal), small parts (piping, button,
// stitches, screws, pompom), colour variants, and a cushion that gives under a loafing cat. Same sizes and
// cat-used heights as the game items (items.js: BOWL_SURF, DECK_STEP, cushion top).
// ?shot=hero|variants|bowl|tower&size=1024&variant=0
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { BREEDS } from './catgen.js';
import { buildCatModel } from './catmodel.js';
import { makeRig, applyPose, loafPose } from './catmotion.js';
import { tex as kitTex, std, cushion, CUSHION_VARIANTS, buildKitItem, buildTower, TOWERS, STEP, KIT_IDS, KIT_ITEMS } from './itemkit.js';
const foodBowl = () => buildKitItem('food_bowl'), tower = () => buildKitItem('cat_tower_1');
const q = new URLSearchParams(location.search);
const N = +(q.get('size') || 1024), shot = q.get('shot') || 'hero';
const C = h => new THREE.Color(h), V = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const tex = (w, h, draw, rx = 1, ry = 1) => kitTex('scene' + w + 'x' + h + rx, w, h, draw, rx, ry);

// ---------------------------------------------------------------- scene: the AC-direction island patch
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(N, N); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
document.body.append(r.domElement);
const sc = new THREE.Scene(); const SKY = '#8fd6f2'; sc.background = C(SKY); sc.fog = new THREE.Fog(SKY, 9, 20);
sc.add(new THREE.HemisphereLight('#cdeeff', '#7fb85a', 1.15));
const sun = new THREE.DirectionalLight('#fff0d0', 3.1); sun.position.set(-2.2, 4.2, 3); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -.0002; sun.shadow.normalBias = .012; sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .1, far: 20 }); sc.add(sun);
const grassTex = tex(512, 512, (g, w) => {
  g.fillStyle = '#74c254'; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 220; i++) { g.fillStyle = rnd() < .5 ? '#7cc85b' : '#6dbb4e'; g.beginPath(); g.ellipse(rnd() * w, rnd() * w, 5 + rnd() * 12, 4 + rnd() * 8, rnd() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 60; i++) { const x = rnd() * w, y = rnd() * w; g.fillStyle = '#63b247'; for (let k = 0; k < 3; k++) { const a = k * 2.1; g.beginPath(); g.arc(x + Math.cos(a) * 4, y + Math.sin(a) * 4, 4, 0, 7); g.fill(); } }
  for (let i = 0; i < 20; i++) { g.fillStyle = rnd() < .6 ? '#fdfbef' : '#ffe27a'; g.beginPath(); g.arc(rnd() * w, rnd() * w, 3, 0, 7); g.fill(); }
}, 14, 14);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), std({ map: grassTex, roughness: .95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);
const cam = new THREE.PerspectiveCamera(28, 1, .05, 80);

if (shot === 'hero') {
  // the three items together, a cat loafing on the cushion (the seat gives under it)
  const b = BREEDS.find(x => x.id === (q.get('breed') || 'korean_shorthair'));
  const cat = buildCatModel(b.shape, b.coat, { res: .016, style: 'ac' });
  const rig = makeRig(cat); applyPose(rig, loafPose(rig)); cat.updateMatrixWorld(true);
  cat.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  const cu = cushion(CUSHION_VARIANTS[+(q.get('variant') || 0)], { x: 0, z: .02, rx: .2, rz: .3, d: .035 }); cu.position.set(-.62, 0, .15); sc.add(cu);
  cat.position.set(-.62, .134 - .03, .15); cat.rotation.y = .5; sc.add(cat);
  const bw = foodBowl(); bw.position.set(.2, 0, .85); sc.add(bw);
  const tw = tower(); tw.position.set(.8, 0, -.45); tw.rotation.y = -.3; sc.add(tw);
  cam.position.set(.1, 2.3, 4.0); cam.lookAt(.05, .1, .1);
} else if (shot === 'variants') {
  CUSHION_VARIANTS.forEach((v, i) => { const cu = cushion(v); cu.position.set((i - 1) * 1.25, 0, 0); sc.add(cu); });
  cam.position.set(0, 1.9, 3.3); cam.lookAt(0, .05, 0);
} else if (shot === 'bowl') {
  const bw = foodBowl(); sc.add(bw); cam.position.set(0, .34, .5); cam.lookAt(0, .015, 0);
} else if (shot === 'towers') {   // the five tower designs in a row, a cat for scale
  const ids = Object.keys(TOWERS);
  ids.forEach((id, i) => { const g = buildTower(id); g.position.set((i - 2) * 1.75, 0, 0); g.rotation.y = -.25; sc.add(g); });
  const b = BREEDS.find(x => x.id === 'korean_shorthair'); const cat = buildCatModel(b.shape, b.coat, { res: .02, style: 'ac' });
  const rig = makeRig(cat); applyPose(rig, loafPose(rig)); cat.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  cat.position.set(-2 * 1.75, STEP + .03, 0); cat.rotation.y = .3; sc.add(cat);
  cam.position.set(0, 3.0, 8.6); cam.lookAt(0, .75, 0);
} else if (TOWERS[shot]) {
  const g = buildTower(shot); g.rotation.y = -.45; sc.add(g);
  const h = { stool: .5, stairs: .9, house: 1.3, tree: 1.3, tall: 2.1 }[shot]; const hc = h + (q.get('cat') ? .75 : 0); cam.position.set(1.3, hc * .75 + 1.0, 3.0 + hc * 1.15); cam.lookAt(0, hc * .47, 0);
  if (q.get('cat')) {   // a cat loafing on the top deck, for scale
    const b = BREEDS.find(x => x.id === q.get('cat')); const cat = buildCatModel(b.shape, b.coat, { res: .02, style: 'ac' });
    const rig = makeRig(cat); applyPose(rig, loafPose(rig)); cat.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
    const t = new THREE.Vector3(...TOWERS[shot].top).applyAxisAngle(new THREE.Vector3(0, 1, 0), g.rotation.y); cat.position.set(t.x, t.y + .01, t.z); cat.rotation.y = .4; sc.add(cat);
  }
} else if (shot === 'item') {   // one item close up (id=, variant=), framed by its bounds
  const g = buildKitItem(q.get('id'), { variant: +(q.get('variant') || 0) }); g.rotation.y = +(q.get('yaw') ?? -.5); sc.add(g); sc.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(g), c = bb.getCenter(new THREE.Vector3()), r = bb.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(14 * Math.PI / 180) * 1.05; cam.position.set(c.x, c.y + d * .55, c.z + d * .84); cam.near = d / 50; cam.updateProjectionMatrix(); cam.lookAt(c);
  sun.shadow.camera.left = sun.shadow.camera.bottom = -Math.max(.5, r * 1.5); sun.shadow.camera.right = sun.shadow.camera.top = Math.max(.5, r * 1.5); sun.shadow.camera.updateProjectionMatrix();
} else if (shot === 'kit') {   // every item (variant=k), on a grid, small things in front
  const ids = KIT_IDS.filter(i => !KIT_ITEMS[i].tower), v = +(q.get('variant') || 0);
  const pos = { hideout: [-1.9, -1.1], litter_box: [-.4, -1.1], cat_tower_1: [1.1, -1.1], cushion: [2.5, -1.1], scratcher: [-2.2, .45], food_bowl: [-1.4, .5], water_bowl: [-.9, .5], milk_bowl: [-.4, .5], can_food: [.1, .5], churu: [.5, .5], ball: [.9, .5], mouse_toy: [1.3, .5], wand_toy: [1.9, .3] };
  for (const id of ids) { const g = buildKitItem(id, { variant: v }); g.position.set(pos[id][0], 0, pos[id][1]); g.rotation.y = id === 'wand_toy' || id === 'churu' ? .6 : 0; sc.add(g); }
  cam.position.set(0, 3.4, 5.2); cam.lookAt(0, .1, -.2);
} else if (shot === 'tower') {
  const tw = tower(); tw.rotation.y = -.5; sc.add(tw); cam.position.set(.4, 1.1, 2.0); cam.lookAt(0, .12, 0);
}
sc.updateMatrixWorld(true);
r.render(sc, cam);
window.__done = true;
</script></body></html>
