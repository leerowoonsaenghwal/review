<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f6f1e3;font-family:Jua,sans-serif;color:#6f5a40;width:1100px}
h1{margin:18px 24px 2px;font-size:28px;font-weight:normal}p{margin:0 24px 10px;font-size:15px;color:#a08a6a}
.row{display:flex;gap:12px;padding:0 12px 16px}.row div{flex:1;background:#fbf6e6;border-radius:22px;overflow:hidden}
.row canvas{display:block;width:532px;height:380px}.row b{display:block;font-weight:normal;font-size:20px;margin:8px 18px 12px}</style></head>
<body><h1>품종 성격 · 행동 포즈</h1><p>외형만이 아니라 품종의 유명한 행동을 게임 속 동작으로 넣는다</p>
<div class="row"><div><canvas id="a"></canvas><b>랙돌 · 안기면 축 늘어지는 성격 → 'flop' 포즈</b></div>
<div><canvas id="b"></canvas><b>터키시 반 · 물을 좋아함 → 물그릇을 앞발로 톡톡 'paw' 포즈</b></div></div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildCat, setPose, BREEDS } from './catgen.js';
function scene(canvas, id, pose, extra, view = [3.4, 2.6, 4.6]) {
  const r = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(2); r.setSize(532, 380, false); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
  const sc = new THREE.Scene(); sc.background = new THREE.Color('#fbf6e6');
  sc.add(new THREE.HemisphereLight('#f2fbff', '#c9b892', 1.35));
  const sun = new THREE.DirectionalLight('#fff4dc', 2); sun.position.set(-3, 6, 5); sun.castShadow = true;
  sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); sc.add(sun);
  const g = new THREE.Mesh(new THREE.CircleGeometry(2.6, 64), new THREE.MeshStandardMaterial({ color: '#a8db84', roughness: 1 }));
  g.rotation.x = -Math.PI / 2; g.receiveShadow = true; sc.add(g);
  const b = BREEDS.find(x => x.id === id), cat = buildCat(b.shape, b.coat); setPose(cat, pose, 0); sc.add(cat);
  extra && extra(sc, cat);
  const box = new THREE.Box3().setFromObject(sc.children.at(-1).isGroup ? cat : cat), c = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(24, 532 / 380, .1, 60); cam.position.set(c.x + view[0], view[1], c.z + view[2]); cam.lookAt(c.x, c.y * .85, c.z + .3);
  r.render(sc, cam);
}
scene(a, 'ragdoll', 'flop', null, [3.6, 3.0, 5.4]);
scene(b, 'turkish_van', 'paw', sc => {
  // a toy water bowl in front of the raised paw
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(.42, .34, .16, 48), new THREE.MeshStandardMaterial({ color: '#7fb0d8', roughness: .5 }));
  bowl.position.set(.3, .08, 1.05); bowl.castShadow = bowl.receiveShadow = true; sc.add(bowl);
  const water = new THREE.Mesh(new THREE.CircleGeometry(.37, 48), new THREE.MeshStandardMaterial({ color: '#bfe6f7', roughness: .15 }));
  water.rotation.x = -Math.PI / 2; water.position.set(.3, .165, 1.05); sc.add(water);
  for (const [x, z, rr] of [[.36, .98, .08], [.2, 1.15, .05]]) {   // ripples
    const ring = new THREE.Mesh(new THREE.RingGeometry(rr, rr + .018, 32), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(x, .17, z); sc.add(ring);
  }
}, [5.6, 2.4, 3.4]);
window.__done = true;
</script></body></html>
