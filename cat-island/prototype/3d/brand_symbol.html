<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Brand symbol of 놀러와요 고양이섬: the "loaf island" - an island shaped like a cat sitting in the loaf pose
// (paws tucked in). Grass back, sandy face (the beach), two ear hills with pink flower patches inside, a sleepy
// smile, the tail curling round as a sandbar, a palm on its back. Sculpted with the same distance-field tools
// as the cats (sdfmesh.js). See docs/BRAND.md.
// ?size=1024&view=icon|symbol|flat&bg=none|c7e3f2&yaw=-.35&elev=.62&zoom=1&sea=1&palm=1
import * as THREE from 'three';
import { sdEllipsoid, sdRoundCone, Field, surfaceNets, relax } from './sdfmesh.js';
const q = new URLSearchParams(location.search);
const N = +(q.get('size') || 1024), view = q.get('view') || 'symbol', bg = q.get('bg') || (view === 'icon' ? 'c7e3f2' : 'none');
const C = h => new THREE.Color(h);
const PAL = { grass: C('#8fca5e'), grassTop: C('#b2de7e'), sand: C('#f7e2ad'), sandWet: C('#e9cf95'), pink: C('#ffb3c4'),
  cocoa: C('#6f5a40'), nose: C('#ff8fa8'), trunk: C('#c99a6b'), leaf: C('#6fb04f'), sea: C('#86cfe6'), foam: C('#eef8fb') };

// ---- 1. the island (one smooth piece)
const F = new Field(), box = (c, r) => [c[0] - r[0], c[1] - r[1], c[2] - r[2], c[0] + r[0], c[1] + r[1], c[2] + r[2]];
const ell = (c, r, k = .12) => F.add({ d: (x, y, z) => sdEllipsoid(x - c[0], y - c[1], z - c[2], r[0], r[1], r[2]), box: box(c, r), k });
const cone = (a, b, r1, r2, k = .08) => F.add({ d: (x, y, z) => sdRoundCone(x, y, z, a, b, r1, r2),
  box: [Math.min(a[0], b[0]) - r1, Math.min(a[1], b[1]) - r1, Math.min(a[2], b[2]) - r1, Math.max(a[0], b[0]) + r1, Math.max(a[1], b[1]) + r1, Math.max(a[2], b[2]) + r1], k });
const BODY = [0, .06, -.26], HEAD = [0, .2, .34];
ell(BODY, [.82, .44, .56], .14);                // the loaf (the cat's back = the island's grassy hill)
ell(HEAD, [.5, .44, .42], .12);                 // head, round, sitting in front of the loaf
ell([0, -.12, -.02], [.98, .09, .86], .16);     // the island's foot: a beach all round
for (const s of [-1, 1]) cone([s * .27, .5, .32], [s * .4, .86, .28], .16, .05, .1);   // ear hills
for (const s of [-1, 1]) ell([s * .22, -.06, .74], [.15, .1, .13], .08);                 // tucked front paws
// tail: a sandbar curling round the right side to the front
cone([.7, -.07, -.5], [.95, -.09, .0], .1, .085, .07); cone([.95, -.09, .0], [.7, -.1, .46], .085, .07, .07);
const bb = F.bounds(); bb[1] = -.2;   // (cut flat under the waterline: nothing below shows)
F.bounds = () => bb;
const FLOOR = -.13;
const field = { eval: (x, y, z) => Math.max(F.eval(x, y, z), FLOOR - y), grad: (x, y, z, e = 1e-3) => [(field.eval(x + e, y, z) - field.eval(x - e, y, z)) / (2 * e), (field.eval(x, y + e, z) - field.eval(x, y - e, z)) / (2 * e), (field.eval(x, y, z + e) - field.eval(x, y, z - e)) / (2 * e)], bounds: () => bb };
const mesh = relax(field, surfaceNets(field, +(q.get('h') || .014), .03), 3);

// ---- 2. colour by place: sand at the waterline, on the face (the beach) and on the tail; grass elsewhere;
// pink flower patches inside the ears
const pos = mesh.pos, n = pos.length / 3, col = new Float32Array(n * 3), c = new THREE.Color();
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
for (let i = 0; i < n; i++) {
  const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2];
  const face = sstep(.06, -.02, Math.hypot(x / .3, (y - .1) / .2) - 1) * sstep(.5, .62, z);   // white muzzle = the beach
  const tail = sstep(.16, .1, Math.min(Math.hypot(x - .9, z + .1), Math.hypot(x - .8, z - .3))) * sstep(.08, -.02, y) * 0;
  const shore = sstep(-.02, -.09, y);
  const top = sstep(.1, .4, y);
  c.copy(PAL.grass).lerp(PAL.grassTop, top * .7);
  c.lerp(PAL.sand, Math.max(face, tail, shore));
  c.lerp(PAL.sandWet, sstep(-.1, -.13, y) * .8);
  for (const s of [-1, 1]) {   // inner ear: the side facing the camera (+z), upper part of the cone
    const t = sstep(.6, .7, y) * sstep(.03, .0, Math.abs(x - s * .34) - .045) * sstep(.33, .4, z);
    c.lerp(PAL.pink, t * .9);
  }
  col.set([c.r, c.g, c.b], i * 3);
}
const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.setIndex(new THREE.BufferAttribute(mesh.idx, 1)); geo.computeVertexNormals();
const island = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .9 }));
island.castShadow = island.receiveShadow = true;
const sym = new THREE.Group(); sym.add(island);

// ---- 3. face on the beach: sleepy closed eyes (smiling arcs), a pink nose, blush. Placed on the surface by
// marching in from the front.
const surf = (x, y) => { let z = 1.6; for (let k = 0; k < 400 && field.eval(x, y, z) > 1e-4; k++) z -= Math.max(field.eval(x, y, z) * .9, 5e-4); return new THREE.Vector3(x, y, z); };
const nrm = p => new THREE.Vector3(...field.grad(p.x, p.y, p.z)).normalize();
const onFace = (x, y, lift = .004) => { const p = surf(x, y); return p.add(nrm(p).multiplyScalar(lift)); };
const matC = (cc, r = .7) => new THREE.MeshStandardMaterial({ color: cc, roughness: r });
for (const s of [-1, 1]) {   // closed eyes: a little upward arc (content, asleep in the sun)
  const pts = []; for (let k = 0; k <= 12; k++) { const a = Math.PI * (k / 12); pts.push(onFace(s * .18 + Math.cos(a) * .075, .3 + Math.sin(a) * .03, .006)); }
  const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .016, 10), matC(PAL.cocoa)); tube.castShadow = true; sym.add(tube);
  for (const e of [0, 12]) { const cap = new THREE.Mesh(new THREE.SphereGeometry(.016, 10, 8), matC(PAL.cocoa)); cap.position.copy(pts[e]); sym.add(cap); }
  const blush = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), new THREE.MeshStandardMaterial({ color: '#ff9fb0', roughness: 1, transparent: true, opacity: .7, depthWrite: false }));
  const bp = onFace(s * .31, .18, .0); blush.position.copy(bp); blush.scale.set(.07, .038, .012); blush.lookAt(bp.clone().add(nrm(bp))); sym.add(blush);
}
const np = onFace(0, .17, .012), nose = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), matC(PAL.nose, .5)); nose.position.copy(np); nose.scale.set(.05, .034, .032); nose.castShadow = true; sym.add(nose);
// mouth: a small "w"
{ const pts = []; for (let k = 0; k <= 16; k++) { const t = k / 16, x = (t - .5) * .12, y = .1 - .018 * Math.abs(Math.sin(t * Math.PI * 2)); pts.push(onFace(x, y, .004)); }
  sym.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 32, .009, 8), matC(PAL.cocoa))); }

// ---- 4. a palm on its back, a flower or two
if (q.get('palm') !== '0') {
  const palm = new THREE.Group(), base = surf(-.42, .3); base.set(-.42, 0, -.25); base.y = (() => { let y = 1; while (field.eval(-.42, y, -.25) > 1e-4 && y > -.2) y -= .002; return y; })();
  const trunkCurve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, -.02, 0), new THREE.Vector3(-.04, .2, 0), new THREE.Vector3(.02, .42, .02)]);
  const trunk = new THREE.Mesh(new THREE.TubeGeometry(trunkCurve, 16, .03, 10), matC(PAL.trunk, .9)); trunk.castShadow = true; palm.add(trunk);
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + .3, l = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), matC(PAL.leaf, .8)); l.scale.set(.2, .028, .075); l.position.set(.02 + Math.cos(a) * .15, .43 - .03, .02 + Math.sin(a) * .15); l.rotation.y = -a; l.rotation.z = -.32; l.castShadow = true; palm.add(l); }
  const coco = new THREE.Mesh(new THREE.SphereGeometry(.035, 12, 10), matC('#8a6a45')); coco.position.set(.04, .39, .05); palm.add(coco);
  palm.position.copy(base); palm.scale.setScalar(.95); sym.add(palm);
  for (const [x, z, cc] of [[.35, -.35, '#ffffff'], [.5, -.15, '#f9cf7a'], [-.15, -.55, '#ff8fa8']]) {
    let y = 1; while (field.eval(x, y, z) > 1e-4 && y > -.2) y -= .002;
    const f = new THREE.Mesh(new THREE.SphereGeometry(.028, 12, 10), matC(cc)); f.position.set(x, y + .015, z); f.castShadow = true; sym.add(f);
  }
}

// ---- 5. scene: sea + soft foam ring for the icon / plain for the symbol
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(N, N); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = +(q.get('exp') || 1.08);
document.body.append(r.domElement);
const sc = new THREE.Scene(); if (bg !== 'none') sc.background = C('#' + bg);
sc.add(new THREE.HemisphereLight('#f4fbff', '#c9b892', 1.2));
const sun = new THREE.DirectionalLight('#fff1d6', 2.5); sun.position.set(-1.6, 3.2, 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -.0003; sun.shadow.normalBias = .015; sun.shadow.radius = 5;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: .1, far: 10 }); sc.add(sun);
const fill = new THREE.DirectionalLight('#ffd9c2', .45); fill.position.set(2, 1, 2); sc.add(fill);
sym.rotation.y = +(q.get('yaw') ?? -.3); sc.add(sym);
if (view === 'icon' || q.get('sea') === '1') {
  const sea = new THREE.Mesh(new THREE.CircleGeometry(8, 96), new THREE.MeshStandardMaterial({ color: PAL.sea, roughness: .55 })); sea.rotation.x = -Math.PI / 2; sea.position.y = FLOOR + .045; sea.receiveShadow = true; sc.add(sea);
  const shallow = new THREE.Mesh(new THREE.CircleGeometry(1, 96), new THREE.MeshStandardMaterial({ color: '#bdeaf0', roughness: .6, transparent: true, opacity: .92 }));   // light shallows hugging the beach
  shallow.rotation.x = -Math.PI / 2; shallow.position.y = FLOOR + .048; shallow.scale.set(1.22, 1.06, 1); shallow.rotation.z = -(+(q.get('yaw') ?? -.3)); sc.add(shallow);
} else if (view === 'symbol') {   // the mark on its own: the island on a small round of sea
  const yaw = -(+(q.get('yaw') ?? -.3));
  const sea = new THREE.Mesh(new THREE.CircleGeometry(1, 128), new THREE.MeshStandardMaterial({ color: PAL.sea, roughness: .55 })); sea.rotation.x = -Math.PI / 2; sea.rotation.z = yaw; sea.scale.set(1.5, 1.3, 1); sea.position.y = FLOOR + .03; sea.receiveShadow = true; sc.add(sea);
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, .06, 128), new THREE.MeshStandardMaterial({ color: '#6fbcd6', roughness: .6 })); rim.rotation.y = yaw; rim.scale.set(1.5, 1, 1.3); rim.position.y = FLOOR - .008; sc.add(rim);
  const shallow = new THREE.Mesh(new THREE.CircleGeometry(1, 96), new THREE.MeshStandardMaterial({ color: '#bdeaf0', roughness: .6 })); shallow.rotation.x = -Math.PI / 2; shallow.rotation.z = yaw; shallow.scale.set(1.2, 1.05, 1); shallow.position.y = FLOOR + .035; shallow.receiveShadow = true; sc.add(shallow);
} else {
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: .16 })); sh.rotation.x = -Math.PI / 2; sh.position.y = FLOOR; sh.receiveShadow = true; sc.add(sh);
}
// ---- 6. camera: from above at the game's angle, fitted to the symbol
sc.updateMatrixWorld(true);
if (view === 'symbol') sym.add(new THREE.Object3D().translateX(0));
const bx = new THREE.Box3().setFromObject(sym), ctr = bx.getCenter(new THREE.Vector3()), sz = bx.getSize(new THREE.Vector3());
const elev = +(q.get('elev') ?? .62), fov = 24, cam = new THREE.PerspectiveCamera(fov, 1, .05, 50);
const rad = Math.max(sz.x, sz.z * .8, sz.y) * .5 / (+(q.get('zoom') || 1)) * (view === 'icon' ? 1.32 : view === 'symbol' ? 1.42 : 1.08);
const dist = rad / Math.tan(fov * Math.PI / 360);
cam.position.set(ctr.x, ctr.y + Math.sin(elev) * dist, ctr.z + Math.cos(elev) * dist); cam.lookAt(ctr.x, ctr.y + (+(q.get('ty') || 0)), ctr.z);
if ((view === 'icon' || q.get('sea') === '1') && bg !== 'none') sc.fog = new THREE.Fog(C('#' + bg), dist * 1.05, dist * 1.7);   // (the far sea melts into the sky: no horizon line)
r.render(sc, cam);
window.__info = { verts: n, box: [bx.min.toArray(), bx.max.toArray()] };
window.__done = true;
</script></body></html>
