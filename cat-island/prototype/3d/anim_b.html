<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Motion feel test (step B): the same cat in several panels side by side.
//   scene=jump  three jump heights (0.2 / 0.4 / 0.8 m), each with its own anticipation (the higher, the longer the
//               crouch is held looking up), squash and stretch, tail and ear springs
//   scene=walk  the walk as computed | with a steady head and soft tail / ears (no bounce: a cat glides)
//   scene=pet   petting with no reaction | the reaction (no hand on screen: the player's finger is the hand)
// ?scene=...&size=480   then window.frame(i) draws frame i at 30 fps; window.__frames, __panels, __labels
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { BREEDS } from './catgen.js';
import { buildCatModel } from './catmodel.js';
import { makeRig, makeClips, solveAt } from './catmotion.js';
import { SpringBones, Squash, holdRemap, PetReaction, HeadSteady, jumpAnticipation, heartSprite } from './motionfeel.js';
const q = new URLSearchParams(location.search);
const N = +(q.get('size') || 480), scene = q.get('scene') || 'jump', FPS = 30;
const b = BREEDS.find(x => x.id === (q.get('breed') || 'korean_shorthair'));
const C = h => new THREE.Color(h), ss = (a, b2, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b2 - a))); return u * u * (3 - 2 * u); };

const cat = buildCatModel(b.shape, b.coat, { res: +(q.get('res') || .016) });
const S = makeRig(buildCatModel(b.shape, b.coat, { res: .03 }));
const rig = makeRig(cat), B = rig.B;
cat.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
const grp = new THREE.Group(); grp.add(cat);
const clipsOf = h => makeClips(rig, { solveRig: S, only: ['JumpUp'], noVerify: true, jumpH: h });
const get = (cs, n) => cs.find(c => c.name === n);

// ---- panels
const tailChain = () => Array.from({ length: 10 }, (_, i) => B['Tail' + (i + 1)]);
const mkFeel = (stiff = 45, damp = 7) => ({ springs: new SpringBones([tailChain(), [B.Ear_L], [B.Ear_R]], { stiffness: stiff, damping: damp }), squash: new Squash(), steady: new HeadSteady(B.Head) });
let panels;
if (scene === 'jump') {
  panels = [.2, .4, .8].map(h => ({ label: `높이 ${h} m`, h, clip: get(clipsOf(h), 'JumpUp'), feel: mkFeel(), ant: jumpAnticipation(h) }));
} else {
  const cs = clipsOf(.2);
  const clip = get(cs, scene === 'walk' ? 'Walk' : 'Sit');
  panels = [{ label: '지금', clip, feel: null }, { label: scene === 'walk' ? '바뀐 걸음' : '바뀐 반응', clip, feel: mkFeel(70, 9) }];
}
window.__panels = panels.length; window.__labels = panels.map(p => p.label);

// ---- renderer, light, ground (the confirmed look)
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(panels.length * N, N); r.setScissorTest(true); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping;
document.body.append(r.domElement);
const sc = new THREE.Scene(); sc.background = C('#8fd6f2'); sc.fog = new THREE.Fog('#8fd6f2', 8, 18); sc.add(grp);
sc.add(new THREE.HemisphereLight('#cdeeff', '#7fb85a', 1.15));
const sun = new THREE.DirectionalLight('#fff0d0', 3.1); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0002; sun.shadow.normalBias = .012; sun.shadow.radius = 3;
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .1, far: 20 }); sc.add(sun); sc.add(sun.target);
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cv = document.createElement('canvas'); cv.width = cv.height = 512; { const g = cv.getContext('2d'); g.fillStyle = '#74c254'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 220; i++) { g.fillStyle = rnd() < .5 ? '#7cc85b' : '#6dbb4e'; g.beginPath(); g.ellipse(rnd() * 512, rnd() * 512, 5 + rnd() * 12, 4 + rnd() * 8, rnd() * 3, 0, 7); g.fill(); }
  for (let i = 0; i < 20; i++) { g.fillStyle = rnd() < .6 ? '#fdfbef' : '#ffe27a'; g.beginPath(); g.arc(rnd() * 512, rnd() * 512, 3, 0, 7); g.fill(); } }
const gt = new THREE.CanvasTexture(cv); gt.colorSpace = THREE.SRGBColorSpace; gt.wrapS = gt.wrapT = THREE.RepeatWrapping; gt.repeat.set(14, 14);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: gt, roughness: .95 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sc.add(ground);

// ---- props: one deck per jump panel; hearts and a soft touch glow for petting
for (const p of panels) if (p.h) {
  const g = new THREE.Group(), back = p.clip.jump.deckBack, L = .8;
  const wood = new THREE.Mesh(new RoundedBoxGeometry(.8, p.h, L, 4, .02), new THREE.MeshStandardMaterial({ color: '#c98f58', roughness: .7 })); wood.position.set(0, p.h / 2, back + L / 2); g.add(wood);
  const top = new THREE.Mesh(new RoundedBoxGeometry(.74, .012, L - .06, 3, .005), new THREE.MeshStandardMaterial({ color: '#7fcbe8', roughness: 1 })); top.position.set(0, p.h + .002, back + L / 2); g.add(top);
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } }); sc.add(g); p.deck = g;
}
const hearts = [], heartMat = heartSprite();
for (let i = 0; i < 6; i++) { const s = new THREE.Sprite(heartMat.clone()); s.visible = false; sc.add(s); hearts.push(s); }
const glowCv = document.createElement('canvas'); glowCv.width = glowCv.height = 64; { const g = glowCv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(glowCv), transparent: true, depthWrite: false, depthTest: false })); glow.visible = false; sc.add(glow);
const pet = new PetReaction(rig);

const DUR = scene === 'jump' ? Math.max(...panels.map(p => p.clip.dur + p.ant.hold)) + .7 : scene === 'walk' ? panels[0].clip.cycle * 4 : 5.2;
window.__frames = Math.round(DUR * FPS);

const rootW = new THREE.Vector3(), headW = new THREE.Vector3(), e = new THREE.Euler(), qq = new THREE.Quaternion();
function pose(p, t) {
  grp.scale.set(1, 1, 1); grp.position.set(0, 0, 0); cat.rotation.set(0, 0, 0);
  for (const o of panels) if (o.deck) o.deck.visible = o === p;
  if (scene === 'jump') {
    const tc = holdRemap(t, .95, p.ant.hold, 1.08);
    solveAt(rig, p.clip, Math.min(tc, p.clip.dur));
    // looking up at the deck through the crouch and the held beat, then the head follows the body
    const w = ss(.4, .9, t) * (1 - ss(.95 + p.ant.hold, 1.1 + p.ant.hold, t));
    e.set(-p.ant.look * w, 0, 0); qq.setFromEuler(e); B.Head.quaternion.multiply(qq); e.set(-.3 * p.ant.look * w, 0, 0); qq.setFromEuler(e); B.Neck.quaternion.multiply(qq);
  } else if (scene === 'walk') solveAt(rig, p.clip, t);
  else { cat.rotation.y = .5; solveAt(rig, p.clip, t % p.clip.dur); }
  cat.updateMatrixWorld(true);
  const f = p.feel;
  if (f) {
    if (scene === 'pet') pet.apply(t, ss(.6, 1.4, t));
    if (scene === 'walk') f.steady.update();
    f.springs.update(1 / FPS);
    if (scene === 'jump') {
      B.Root.getWorldPosition(rootW);
      const s2 = f.squash.update(1 / FPS, rootW.y), sxz = 1 / Math.sqrt(s2.sy);
      grp.scale.set(sxz, s2.sy, sxz); grp.position.set(rootW.x * (1 - sxz), rootW.y * (1 - s2.sy), rootW.z * (1 - sxz));
    }
  }
  grp.updateMatrixWorld(true);
}
const cam = new THREE.PerspectiveCamera(28, 1, .05, 60);
function place() {
  B.Root.getWorldPosition(rootW); B.Head.getWorldPosition(headW);
  if (scene === 'jump') { cam.position.set(4.6, 1.9, 1.3); cam.lookAt(0, .62, .8); }
  else if (scene === 'walk') { cam.position.set(2.4, .9, rootW.z + .5); cam.lookAt(0, .38, rootW.z + .05); }
  else { cam.position.set(headW.x + 1.5, headW.y + .8, headW.z + 2.2); cam.lookAt(headW.x, headW.y - .02, headW.z); }
  sun.position.set(rootW.x - 2.2, 4.2, rootW.z + 3); sun.target.position.copy(rootW);
}
function props(p, t) {
  const react = scene === 'pet' && !!p.feel;   // (a boolean: three.js only hides on visible === false)
  B.Head.getWorldPosition(headW);
  // the finger's touch: a soft glow sliding over the head (both panels: the player strokes either way)
  glow.visible = scene === 'pet' && t > .3;
  if (glow.visible) { const ph = ((t - .3) / 1.3) % 1, along = ph < .7 ? ph / .7 : 1 - (ph - .7) / .3, yaw = .5;
    glow.position.set(headW.x + Math.sin(yaw) * (.05 - .25 * along), headW.y + .22, headW.z + Math.cos(yaw) * (.05 - .25 * along)); glow.scale.setScalar(.13); glow.material.opacity = ph < .7 ? .85 : .25; }
  for (const [i, s] of hearts.entries()) {
    const t0 = 1.2 + i * .65, u = (t - t0) / 1.5;
    s.visible = react && u > 0 && u < 1;
    if (s.visible) { s.position.set(headW.x + .18 * Math.sin(i * 2.1), headW.y + .3 + .35 * u, headW.z + .05); s.material.opacity = 1 - u * u; s.scale.setScalar(.07 + .04 * Math.sin(Math.PI * Math.min(1, u * 3))); }
  }
}
window.frame = (i) => {
  const t = i / FPS;
  panels.forEach((p, k) => { pose(p, t); props(p, t); place(); r.setViewport(k * N, 0, N, N); r.setScissor(k * N, 0, N, N); r.render(sc, cam); });
  return true;
};
window.__done = true;
</script></body></html>
