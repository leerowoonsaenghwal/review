<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>body{margin:0;background:#f6f1e3;font:14px sans-serif;color:#6f5a40}</style></head><body><div id="w"></div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildCat, setPose, BREEDS } from './catgen.js';
// Inspection sheet: each breed from front / 3-4 / side / back / top, in stand and walk poses.
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'scottish_fold').split(',');
const pose = q.get('pose') || 'walk';
const views = [['front', [0, 1.1, 5.2]], ['3/4', [3.7, 1.6, 3.7]], ['side', [5.4, 1.0, .3]], ['back', [-1.2, 1.6, -5.0]], ['top', [.01, 6.2, .9]]];
const CW = 300, CH = 280, W = CW * views.length, H = CH * ids.length;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setScissorTest(true);
w.appendChild(r.domElement);
ids.forEach((id, row) => {
  const b = BREEDS.find(x => x.id === id);
  views.forEach(([name, p], col) => {
    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight('#f2fbff', '#c9b892', 1.35));
    const sun = new THREE.DirectionalLight('#fff4dc', 2); sun.position.set(-3, 6, 5); sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4; scene.add(sun);
    const g = new THREE.Mesh(new THREE.CircleGeometry(2, 48), new THREE.MeshStandardMaterial({ color: '#a8db84' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
    const cat = buildCat(b.shape, b.coat); setPose(cat, pose, .1); scene.add(cat);
    const k = b.shape.size || 1; const cam = new THREE.PerspectiveCamera(26, CW / CH, .1, 50); cam.position.set(p[0] * k, p[1] * k, p[2] * k); cam.lookAt(0, .75 * k, 0);
    r.setViewport(col * CW, H - (row + 1) * CH, CW, CH); r.setScissor(col * CW, H - (row + 1) * CH, CW, CH); r.render(scene, cam);
  });
});
window.__done = true;
</script></body></html>
