<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>

  body { margin: 0; background: #f6f1e3; font-family: Jua, sans-serif; color: #6f5a40; }
  h1 { margin: 18px 24px 4px; font-size: 30px; font-weight: normal; }
  p.sub { margin: 0 24px 10px; font-size: 16px; color: #a08a6a; }
  #wrap { position: relative; }
  canvas { position: absolute; left: 0; top: 0; }
  .grid { position: relative; display: grid; gap: 0; padding: 0 12px 16px; }
  .cell { height: 250px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 12px; box-sizing: border-box; }
  .cell b { font-weight: normal; font-size: 20px; background: #fbf6e6; border-radius: 999px; padding: 4px 16px; box-shadow: 0 2px 0 rgba(0,0,0,.06); }
  .cell small { font-size: 12px; color: #a08a6a; margin-top: 4px; }
</style>
</head>
<body>
<h1 id="title"></h1><p class="sub" id="sub"></p>
<div id="wrap"><div class="grid" id="grid"></div></div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildCat, setPose, BREEDS, KOREAN_COATS } from './catgen.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'breeds';
const COLS = mode === 'breeds' ? 8 : 6, CW = 210, CH = 250;
let items;
if (mode === 'breeds') {
  items = BREEDS.map(b => ({ label: b.ko, sub: b.id.replace(/_/g, ' '), shape: b.shape, coat: b.coat }));
  title.textContent = `품종별 기본 외형 · ${items.length}종 (걷는 자세)`; sub.textContent = '귀 · 얼굴 · 체형 · 다리 길이 · 털 길이(단모/장모/곱슬/렉스/무모) · 꼬리';
} else {
  items = KOREAN_COATS.map(c => ({ label: c.ko, sub: c.coat.pattern, shape: {}, coat: { eye: '#c9a227', ...c.coat } }));
  title.textContent = '털 무늬 프리셋 (코리안 숏헤어 체형)'; sub.textContent = '사진에서 뽑은 색과 무늬를 이 프리셋에 입힙니다';
}
const rows = Math.ceil(items.length / COLS);
grid.style.gridTemplateColumns = `repeat(${COLS}, ${CW}px)`;
for (const it of items) grid.insertAdjacentHTML('beforeend', `<div class="cell"><b>${it.label}</b><small>${it.sub}</small></div>`);
const W = COLS * CW + 24, H = rows * CH;
document.body.style.width = W + 'px';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(2); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.setScissorTest(true);
wrap.prepend(renderer.domElement);

items.forEach((it, i) => {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#f2fbff', '#c9b892', 1.35));
  const sun = new THREE.DirectionalLight('#fff4dc', 2.0); sun.position.set(-3, 6, 5); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 5; Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(1.7, 48), new THREE.MeshStandardMaterial({ color: '#a8db84', roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const cat = buildCat(it.shape, it.coat); setPose(cat, 'walk', .12); cat.rotation.y = .42; scene.add(cat);
  const cam = new THREE.PerspectiveCamera(24, CW / (CH - 40), .1, 50);
  cam.position.set(7.0, 2.7, 2.2); cam.lookAt(0, .86, .05);
  const col = i % COLS, row = Math.floor(i / COLS);
  const x = 12 + col * CW, y = H - (row + 1) * CH;
  renderer.setViewport(x, y + 40, CW, CH - 40); renderer.setScissor(x, y + 40, CW, CH - 40);
  renderer.render(scene, cam);
});
window.__done = true;
</script>
</body>
</html>
