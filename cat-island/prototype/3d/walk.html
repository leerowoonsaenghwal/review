<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>body{margin:0;background:#f6f1e3;font-family:Jua,sans-serif;color:#6f5a40}h1{margin:16px 24px 4px;font-size:28px;font-weight:normal}p{margin:0 24px 6px;color:#a08a6a}</style>
</head><body><h1 id="t"></h1><p>걷기 1주기를 8프레임으로 나눈 것 (뒷왼 → 앞왼 → 뒷오 → 앞오 순서로 발이 나감)</p><div id="w"></div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildCat, setPose, BREEDS } from './catgen.js';
const q = new URLSearchParams(location.search);
const id = q.get('id') || 'scottish_fold';
const b = BREEDS.find(x => x.id === id);
t.textContent = `${b.ko} · 걷기 동작`;
const N = 8, CW = 200, CH = 200, W = N * CW, H = CH * 2;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setScissorTest(true);
w.appendChild(r.domElement);
for (let row = 0; row < 2; row++) for (let i = 0; i < N; i++) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#f2fbff', '#c9b892', 1.35));
  const sun = new THREE.DirectionalLight('#fff4dc', 2); sun.position.set(-3, 6, 5); sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4; scene.add(sun);
  const g = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshStandardMaterial({ color: '#a8db84' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  const cat = buildCat(b.shape, b.coat); setPose(cat, 'walk', i / N); scene.add(cat);
  const cam = new THREE.PerspectiveCamera(24, 1, .1, 50);
  if (row === 0) { cam.position.set(7.2, 1.3, .25); cam.lookAt(0, .8, .3); } else { cam.position.set(4.8, 2.6, 4.4); cam.lookAt(0, .78, .15); }
  r.setViewport(i * CW, (1 - row) * CH, CW, CH); r.setScissor(i * CW, (1 - row) * CH, CW, CH); r.render(scene, cam);
}
window.__done = true;
</script></body></html>
