<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><style>body{margin:0;background:#f6f1e3}</style></head><body><div id="w"></div>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildCat, setPose, BREEDS } from './catgen.js';
// Front-face close-ups: checks eyes, highlights, nose, mouth at the most critical angle.
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || BREEDS.map(b => b.id).join(',')).split(',');
const COLS = Math.min(8, ids.length), CW = 210, CH = 210, rows = Math.ceil(ids.length / COLS);
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(2); r.setSize(COLS * CW, rows * CH); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.setScissorTest(true);
w.appendChild(r.domElement);
ids.forEach((id, i) => {
  const b = BREEDS.find(x => x.id === id);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight('#f2fbff', '#c9b892', 1.35));
  const sun = new THREE.DirectionalLight('#fff4dc', 2); sun.position.set(-3, 6, 5); scene.add(sun);
  const cat = buildCat(b.shape, b.coat); setPose(cat, 'stand', 0); scene.add(cat);
  cat.updateMatrixWorld(true);
  const hp = new THREE.Vector3(); cat.userData.rig.head.getWorldPosition(hp);
  const cam = new THREE.PerspectiveCamera(20, 1, .1, 50); cam.position.set(hp.x, hp.y + .1, hp.z + 4.2 * (b.shape.size || 1)); cam.lookAt(hp);
  const x = (i % COLS) * CW, y = (rows - 1 - Math.floor(i / COLS)) * CH;
  r.setViewport(x, y, CW, CH); r.setScissor(x, y, CW, CH); r.render(scene, cam);
});
window.__done = true;
</script></body></html>
